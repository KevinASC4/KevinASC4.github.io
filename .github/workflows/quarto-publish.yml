name: Quarto Publish

on:
  push:
    branches:
      - gh-pages  # Trigger deployment on push to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript install_packages_r.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        run: |
          git config --local user.email "LopezSepulvedaKevinAdrian@gmail.com"
          git config --local user.name "Kevin Lopez Sepulveda"
          git checkout gh-pages
          cp -r _site/* .
          git add .
          git commit -m "Automated deploy of Quarto site" || echo "No changes to commit"
          git push origin gh-pages